<style>
/* ---------- Compra ---------- */
.buy{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(24px,4.5vw,80px);align-items:start;padding-top:16px;padding-bottom:var(--sec)}
.gal{position:sticky;top:88px;min-width:0}
.stage{position:relative;height:min(calc(100svh - 190px),820px);min-height:500px;background:var(--bg2);overflow:hidden;touch-action:pan-y}
.view{position:absolute;inset:0;opacity:0;transition:opacity .6s var(--ease);pointer-events:none}
.view.on{opacity:1;pointer-events:auto}
.view>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* La botella: recorte real, completa y siempre del mismo tamaño (sin vista 3D) */
.view.v-bot>img{inset:auto;left:50%;bottom:9%;width:auto;height:82%;max-width:74%;object-fit:contain;object-position:50% 100%;transform:translateX(-50%);transform-origin:50% 100%;transition:transform 1.6s var(--ease)}
.view.v-bot>img.raw{bottom:4%;height:92%;mix-blend-mode:multiply}
@media (hover:hover){.stage:hover .view.v-bot>img{transform:translateX(-50%) scale(1.02)}}
.floor{position:absolute;left:50%;bottom:7.3%;width:26%;height:4%;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(38,28,20,.28),rgba(38,28,20,0));pointer-events:none}
/* Etiqueta, ficha técnica y maridaje: las imágenes del sitio actual, sobre blanco como en lacetto.mx */
.view.v-sheet{background:#fff}
.view.v-sheet>img{object-fit:contain;padding:clamp(8px,1.4vw,22px)}
.stage .tag{position:absolute;z-index:3;font:500 11px/1.3 var(--sans);letter-spacing:.06em;color:var(--ink2)}
.stage .tag.tl{top:14px;left:16px;transition:opacity .4s var(--ease)}
.stage.vista-alt .tag{opacity:0;pointer-events:none}
.thumbs{display:flex;gap:var(--g);margin:calc(var(--g) - 3px) 0 0 -3px;padding:3px;overflow-x:auto;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs[hidden]{display:none}
.thumbs button{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;text-align:left}
.thumbs .tb{width:78px;height:78px;background:var(--bg2);overflow:hidden;display:grid;place-items:center;outline:1px solid transparent;outline-offset:2px;transition:outline-color .2s}
.thumbs .tb img{width:100%;height:100%;object-fit:cover}
.thumbs .tb img.ct{width:auto;height:84%;max-width:84%;object-fit:contain}
.thumbs .tb.w{background:#fff}
.thumbs .tb.w img{object-fit:contain}
.thumbs span.l{font-size:12px;color:var(--ink3)}
.thumbs button[aria-pressed="true"] .tb{outline-color:var(--ink)}
.thumbs button[aria-pressed="true"] span.l{color:var(--ink)}

.panel{padding-top:clamp(8px,2vw,28px)}
.pname{font:400 clamp(48px,5.6vw,92px)/.95 var(--serif);letter-spacing:-.022em;margin:16px 0 10px}
.pname small{display:block;font:400 15px/1.4 var(--sans);letter-spacing:0;color:var(--ink2);margin-top:10px}
.rate{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2);border-bottom:1px solid transparent}
.rate:hover{border-color:currentColor}
/* Estrellas: la misma estrella dibujada del resto del sitio (máscara), rellena según la calificación */
.stars{--s:13px;display:inline-block;vertical-align:-1px;width:calc(var(--s) * 5.715);height:var(--s);font-size:0;color:transparent;background:linear-gradient(90deg,var(--ink) var(--p),rgba(43,44,45,.2) var(--p));-webkit-mask-size:calc(var(--s) * 1.143) var(--s);mask-size:calc(var(--s) * 1.143) var(--s)}
.occ{font:italic 400 clamp(20px,1.7vw,25px)/1.4 var(--serif);margin:26px 0 26px;max-width:30ch}
.prc{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px}
.prc b{font:400 32px/1 var(--sans);letter-spacing:-.015em;font-variant-numeric:lining-nums tabular-nums}
.prc s{font-size:17px;color:var(--ink3)}
.prc span{font-size:13.5px;color:var(--ink2)}
.prc .mem{color:var(--wine);font-weight:500}
.prc .oos-t{font:500 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--wine);border:1px solid currentColor;padding:6px 8px;align-self:center}
.pline{color:var(--ink2)}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.opts{border:0;margin:22px 0 0;display:grid;gap:8px}
.opts legend{margin-bottom:10px;color:var(--ink2)}
.opt{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);cursor:pointer;transition:border-color .3s var(--ease)}
.opt:hover{border-color:rgba(43,44,45,.3)}
/* Radio propio: un aro fino y un punto, sin el relleno blanco del radio del navegador */
.opt input{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin:0;border-radius:50%;border:1px solid rgba(43,44,45,.38);background:transparent;display:grid;place-items:center;cursor:pointer;transition:border-color .3s var(--ease)}
.opt input::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .3s var(--ease)}
.opt input:checked{border-color:var(--ink)}
.opt input:checked::before{transform:scale(1)}
.opt input:focus{outline:none}
.opt:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
.opt:has(input:checked){border-color:rgba(43,44,45,.72)}
.opt:has(input:disabled){opacity:.55;cursor:default}
.opt:has(input:disabled):hover{border-color:var(--line)}
.o-n{font-size:15px}
.o-n em{font-style:normal;font-size:12px;color:var(--wine);margin-left:8px;white-space:nowrap}
.o-n small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.o-p{text-align:right;font-size:15px;white-space:nowrap}
.o-p s{font-size:12.5px;color:var(--ink3);margin-right:6px}
.buyrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;margin-top:14px}
.qsel{display:flex;align-items:center;border:1px solid var(--line);height:48px;padding:0 4px}
.qsel button{flex:0 0 40px;width:40px;height:46px;display:grid;place-items:center;padding:0;font-size:17px;line-height:1;color:var(--ink)}
.qsel span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.buyrow .btn{width:100%}
.buyrow[hidden],.oos[hidden]{display:none}
.alt{display:inline-block;margin-top:16px}
.qsel button:disabled{opacity:.35;cursor:default}
.bnote{font-size:13px;color:var(--ink2);margin-top:10px}
.bnote:empty{display:none}
/* Agotado: aviso por correo y alternativas */
.oos{margin-top:18px;scroll-margin-top:110px}
.ntf-f label{display:block;margin-bottom:10px}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.nrow input{height:48px;border:1px solid var(--line);background:var(--panel,#FBFAF7);padding:0 14px;font:400 15px/1 var(--sans);color:var(--ink);min-width:0}
.nrow input:focus{border-color:var(--ink);outline:none;box-shadow:0 2px 0 var(--ink)}
.nrow input[aria-invalid=true],.wr [aria-invalid=true]{border-color:var(--wine)}
.nerr{font-size:13px;color:var(--wine);margin-top:8px}
.ntf-ok{padding:16px;background:var(--bg2);font-size:14.5px;line-height:1.5}
.ntf-ok:focus{outline:none}
.alts-b{margin-top:22px}
.alts-b>.cap{color:var(--ink3)}
.alts-b ul{list-style:none;margin-top:10px;border-top:1px solid var(--line)}
.alts-b li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.alts-b a.ai{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0}
.alts-b .fld{width:44px;height:56px}
.alts-b .fld::after{display:none}
.alts-b .fld img{height:90%}
.alts-b small{display:block;font:500 10.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.alts-b b{font:400 17px/1.2 var(--serif)}
.alts-b em{font-style:normal;font-size:13px;color:var(--ink2);margin-left:6px}
.alts-b .price{font-size:14.5px}
.alts-b a.ai:hover b{text-decoration:underline;text-underline-offset:3px}
.facts{display:grid;grid-template-columns:1fr 1fr;margin-top:30px;border-top:1px solid var(--line)}
.facts div{padding:14px 0;border-bottom:1px solid var(--line)}
.facts div:nth-child(odd){padding-right:16px}
.facts dt{font:500 10.5px/1.4 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.facts dd{font:400 15.5px/1.4 var(--sans);font-variant-numeric:lining-nums;margin-top:4px}
.perks{list-style:none;margin-top:24px;display:grid;gap:10px;font-size:13.5px;color:var(--ink2)}
.perks b{color:var(--ink);font-weight:500;margin-right:6px}

html{scroll-padding-top:96px}

.st{padding-block:var(--sec)}
.big{font-size:clamp(38px,5vw,78px);max-width:18ch}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(20px,3vw,48px);margin-top:clamp(36px,4vw,64px)}
.tri>div{border-top:1px solid var(--line);padding-top:16px}
.tri b{display:block;font:400 26px/1.1 var(--serif);margin:0 0 10px}
.tri p{color:var(--ink2);font-size:15.5px;max-width:36ch}
.aromas{list-style:none;display:flex;flex-wrap:wrap;gap:6px clamp(22px,2.6vw,40px);margin-top:clamp(36px,4vw,60px);font:400 clamp(24px,2.6vw,40px)/1.25 var(--serif)}
.aromas li{display:inline-flex;align-items:center;white-space:nowrap}
.aromas li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;border:1px solid var(--ink3);margin-right:clamp(10px,1vw,14px)}
.perfil{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--g);margin-top:clamp(36px,4vw,60px)}
.perfil div{background:var(--bg2);padding:18px}
.perfil dt{font:500 10.5px/1.4 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.perfil dd{font:400 24px/1.2 var(--serif);margin-top:8px}
.st-desc{font:400 clamp(22px,1.9vw,30px)/1.4 var(--serif);max-width:min(100%,60ch);margin-top:28px}

.mesa{background:var(--dark);color:#EEE9E1}
.mesa-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(32px,6vw,104px);align-items:start}
.mesa .p{color:rgba(238,233,225,.7);margin-top:18px}
.plist{list-style:none;border-top:1px solid rgba(238,233,225,.2)}
.plist li{padding:18px 0;border-bottom:1px solid rgba(238,233,225,.2);font:400 clamp(24px,2.4vw,36px)/1.15 var(--serif)}

.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--g);margin-top:clamp(28px,3vw,44px)}
.steps4.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.sc{position:relative;display:flex;flex-direction:column}
.sc .ph{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--bg2)}
.sc .ph img,.sc .ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc b{display:block;font:400 22px/1.15 var(--serif);margin-top:14px}
.sc p{font-size:14.5px;color:var(--ink2);margin-top:6px;max-width:30ch}

.prem{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(24px,5vw,88px);align-items:end;border-top:1px solid var(--line);padding-top:clamp(24px,3vw,40px)}
.prem p{font:400 clamp(21px,1.9vw,28px)/1.35 var(--serif);max-width:34ch}
.prem .ul{margin-top:22px}

.rev{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(24px,5vw,88px)}
.rev .avg{font:400 clamp(64px,7vw,104px)/1 var(--sans);letter-spacing:-.04em;font-variant-numeric:lining-nums;margin-bottom:12px}
.rev .stars{--s:17px;display:block}
/* Escribir una reseña (simulado) */
.wr{margin-top:22px;display:grid;gap:14px;max-width:420px}
.wr[hidden]{display:none}
.wr fieldset{border:0}
.wr legend,.wr label.l{font:500 11px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;display:block}
.wr-stars{display:flex;gap:2px}
.wr-stars label{cursor:pointer;font-size:26px;line-height:1;color:rgba(43,44,45,.22);padding:2px;transition:color .15s}
.wr-stars label.f{color:var(--ink)}
.wr-stars input{position:absolute;opacity:0;width:1px;height:1px}
.wr-stars input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.wr input[type=text],.wr textarea{width:100%;border:1px solid var(--line);background:var(--panel,#FBFAF7);padding:12px 14px;font:400 15px/1.45 var(--sans);color:var(--ink)}
.wr input[type=text]:focus,.wr textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 2px 0 var(--ink)}
.wr fieldset[aria-invalid=true] .wr-stars label{color:rgba(107,34,48,.35)}
.wr .err{font-size:13px;color:var(--wine)}
.wr .fine{font-size:12px;color:var(--ink3)}
.wr-ok{margin-top:22px;padding:16px;background:var(--bg2);font-size:14.5px;max-width:420px}
.wr-ok:focus{outline:none}
.rev .meta{font-size:13.5px;color:var(--ink2);margin:10px 0 22px}
.rlist{border-top:1px solid var(--line)}
.ri{padding:20px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px}
.ri b{font-weight:500;font-size:14.5px}
.ri time{font-size:13px;color:var(--ink3);text-align:right}
.ri p{grid-column:1/-1;font:400 21px/1.35 var(--serif);max-width:44ch}
.ri small{grid-column:1/-1;font-size:12.5px;color:var(--ink3)}
.empty-r{font:400 24px/1.3 var(--serif);color:var(--ink2)}

/* Barra fija de compra */
.sbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px var(--m);transform:translateY(102%);transition:transform .45s var(--ease)}
.sbar.on{transform:none}
.sbar .fld{width:40px;height:52px;flex:0 0 auto}
.sbar .fld::after{display:none}
.sbar .fld img{height:92%}
.sbar .t{flex:1;min-width:0;line-height:1.25}
.sbar .t small{display:block;font:500 10.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.sbar .t b{font:400 19px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sbar .btn{height:44px;padding:0 18px}

@media (max-width:900px){
  .buy{grid-template-columns:minmax(0,1fr);gap:22px}
  .gal{position:relative;top:auto}
  .stage{height:auto;aspect-ratio:1/1.08;min-height:0}
  .tri,.mesa-in,.rev,.prem{grid-template-columns:minmax(0,1fr)}
  .perfil dd{font-size:20px}
  .steps4,.steps4.n3{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--m);margin-inline:calc(var(--m) * -1);padding-inline:var(--m);scrollbar-width:none}
  /* En celular: línea, nombre y precio en la primera pantalla */
  .stage{aspect-ratio:1/.92}
  .panel{display:flex;flex-direction:column;padding-top:0}
  .panel>*{order:5}
  .panel>.pline,.panel>.pname{order:1}
  .panel>.prc{order:2;border-top:0;padding-top:0;margin-top:2px}
  .panel>.pmeta{order:3;margin-top:14px}
  .panel>.occ{order:4}
  .panel>.alt{align-self:flex-start}
  .pname{margin:10px 0 12px}
  .steps4::-webkit-scrollbar{display:none}
  .sc{flex:0 0 66vw;scroll-snap-align:start}
}
@media (max-width:640px){
  .thumbs .tb{width:56px;height:56px}
  .pname{font-size:clamp(40px,11.5vw,56px)}
  .perfil{gap:6px}
  .perfil div{padding:14px 12px}
  .perfil dd{font-size:18px}
  .opt{padding:12px}
  .o-n em{display:block;margin:2px 0 0}
  .sbar .t small{display:none}
  .sbar .btn{padding:0 14px;font-size:11.5px}
}
@media (prefers-reduced-motion:reduce){.sbar{transition:none}}
.prem-a{display:flex;flex-wrap:wrap;gap:6px 28px;margin-top:6px}

/* "Con qué abrirlo" con la foto real del vino en la mesa: foto a media pantalla y el maridaje al lado */
.mesa.mesa-ph{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:0;align-items:stretch}
.mesa.mesa-ph .mesa-fig{position:relative;margin:0;min-height:min(84vh,820px);overflow:hidden}
.mesa.mesa-ph .mesa-fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.03);transition:transform 1.8s var(--ease)}
.mesa.mesa-ph:hover .mp img{transform:scale(1)}
.mesa.mesa-ph .mesa-fig figcaption{position:absolute;left:18px;bottom:16px;font:italic 400 17px/1.2 var(--serif);color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.45)}
.mesa.mesa-ph>.wrap{display:flex;align-items:center;padding:var(--sec) clamp(28px,5vw,96px)}
.mesa.mesa-ph .mesa-in{grid-template-columns:minmax(0,1fr);gap:clamp(28px,3vw,44px);width:100%}
@media (max-width:900px){.mesa.mesa-ph{grid-template-columns:minmax(0,1fr)}.mesa.mesa-ph .mesa-fig{min-height:0;aspect-ratio:4/3}.mesa.mesa-ph>.wrap{padding:clamp(40px,8vw,64px) var(--m)}}

/* ---------- Aparición suave al llegar a cada sección ---------- */
.rv{opacity:0;transform:translateY(18px);transition:opacity 1.1s var(--ease),transform 1.3s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.wrev .w{display:inline-block;opacity:0;transform:translateY(.34em);filter:blur(3px);transition:opacity .9s var(--ease),transform 1.1s var(--ease),filter .9s var(--ease);transition-delay:calc(.12s + var(--i) * 24ms)}
.wrev.in .w{opacity:1;transform:none;filter:none}
.tri-c{margin-top:clamp(40px,4.4vw,68px)}
@media (prefers-reduced-motion:reduce){.rv,.wrev .w{opacity:1;transform:none;filter:none;transition:none}}

/* ---------- Reconocimientos con las medallas oficiales ---------- */
.rc-top{display:block;text-align:center;border-top:1px solid var(--line);padding-top:clamp(44px,5vw,80px)}
.rc-h .cap{color:var(--ink3)}
.rc-h{display:flex;flex-direction:column;align-items:center}
.rc-h h2{margin-top:14px;max-width:18ch;font-size:clamp(34px,3.4vw,54px);line-height:1.04;text-wrap:balance}
.rc-n{font-variant-numeric:lining-nums tabular-nums}
.rc-p{color:var(--ink2);margin-top:14px;font-size:14.5px;max-width:40ch}

{const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{rootMargin:'0px 0px -10% 0px'});

   (function f(t){const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);n.textContent=Math.round(N*e);if(k<1)requestAnimationFrame(f)})(t0)},{rootMargin:'0px 0px -15% 0px'});cio.observe(n)}
