<style>
/* ---------- Intro ---------- */
.t-intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,400px);gap:clamp(24px,4vw,72px);align-items:end;padding-top:clamp(20px,2.6vw,40px)}
.t-h1{font:400 clamp(52px,7.4vw,118px)/.92 var(--serif);letter-spacing:-.022em}
.t-intro .p{margin-top:18px;max-width:48ch}
.qcard{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:stretch;background:var(--bg2);text-align:left;transition:background .25s}
.qcard:hover{background:var(--bg3)}
.qcard .ph{position:relative;overflow:hidden;min-height:132px}
.qcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.qcard:hover .ph img{transform:scale(1.05)}
.qcard .tx{padding:16px 16px 16px 0;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.qcard b{font:400 22px/1.15 var(--serif);display:block}
.qcard small{display:block;font-size:13.5px;color:var(--ink2);margin-top:4px}
.qcard .ul{align-self:flex-start;font-size:11px}

/* ---------- Banner de línea ---------- */
.lb{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(24px,4vw,72px);align-items:stretch;padding-top:clamp(20px,2.6vw,40px)}
.lb-t{display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding-bottom:6px}
.lb-t blockquote{font:italic 400 clamp(21px,1.8vw,27px)/1.35 var(--serif);max-width:28ch;margin-top:22px}
.lb-t cite{display:block;font:500 11px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-style:normal;margin-top:12px}
.lb-facts{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:14px;color:var(--ink2);border-top:1px solid var(--line);padding-top:16px}
.lb-facts b{font-weight:500;color:var(--ink)}
.fan{position:relative;background:var(--bg2);min-height:clamp(340px,36vw,520px);overflow:hidden;isolation:isolate}
.fan .b{position:absolute;bottom:4%;aspect-ratio:1;height:84%;left:50%;transform:translateX(-50%);background:var(--bg2)}
.fan .b.c{z-index:2}
.fan .b img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;position:relative;z-index:1;transition:transform 1s var(--ease)}
.fan .b::after{content:"";position:absolute;left:50%;bottom:3.3%;width:30%;height:5%;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(38,28,20,.32),rgba(38,28,20,0))}
.fan .b.l{transform:translateX(-112%) scale(.86);transform-origin:bottom center}
.fan .b.r{transform:translateX(12%) scale(.86);transform-origin:bottom center}
.fan:hover .b.c img{transform:translateY(-12px)}
.fan .lbl{position:absolute;left:16px;bottom:14px;z-index:3}

/* Estaciones: la botella gira y cambia de etiqueta */
.es-stage{position:relative;min-height:clamp(380px,40vw,580px);overflow:hidden;isolation:isolate;transition:background-color 1s var(--ease);perspective:1100px;display:grid;place-items:center}
.es-rot{position:relative;height:92%;aspect-ratio:1;will-change:transform;background:inherit}
.es-rot .bw{position:absolute;inset:0;transform:scaleX(var(--sq,1));transition:transform .5s var(--ease);background:inherit}
.es-rot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.es-rot img.nx{opacity:0}
.es-rot.wipe img.cu{-webkit-mask-image:linear-gradient(90deg,transparent 0 45%,#000 55% 100%);mask-image:linear-gradient(90deg,transparent 0 45%,#000 55% 100%);-webkit-mask-size:260% 100%;mask-size:260% 100%;animation:wipeCu .9s var(--ease) forwards}
.es-rot.wipe img.nx{opacity:1;-webkit-mask-image:linear-gradient(90deg,#000 0 45%,transparent 55% 100%);mask-image:linear-gradient(90deg,#000 0 45%,transparent 55% 100%);-webkit-mask-size:260% 100%;mask-size:260% 100%;animation:wipeNx .9s var(--ease) forwards}
@keyframes wipeCu{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes wipeNx{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
.es-floor{position:absolute;left:50%;bottom:calc(4% + 3.3% * .92);width:24%;height:4.4%;transform:translateX(calc(-50% + var(--fx,0px)));background:radial-gradient(closest-side,rgba(38,28,20,.34),rgba(38,28,20,0));z-index:2;mix-blend-mode:multiply;pointer-events:none}
.es-stage .lbl{position:absolute;left:16px;bottom:14px;z-index:3;display:flex;gap:10px;align-items:center}
.es-name{font:400 clamp(30px,3vw,46px)/1 var(--serif);margin-top:18px;min-height:1em}
.es-name small{display:block;font:400 14px/1.4 var(--sans);color:var(--ink2);margin-top:8px}
.es-tabs{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:22px}
.es-tabs button{display:inline-flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink3);padding:6px 0;border-bottom:1px solid transparent}
.es-tabs button i{width:11px;height:11px;display:block}
.es-tabs button[aria-pressed=true]{color:var(--ink);border-color:currentColor}
.es-pp{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font:500 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);padding:6px 0}
.es-pp:hover{color:var(--ink)}
.es-pp .i-play{display:none}
.es-pp[aria-pressed=true] .i-play{display:block}
.es-pp[aria-pressed=true] .i-pause{display:none}
.es-buy{display:flex;align-items:center;flex-wrap:wrap;gap:14px 22px}
.es-buy .price{font-size:18px}

/* ---------- Pestañas por tipo ---------- */
.ttabs{position:relative;display:flex;gap:clamp(18px,2.3vw,34px);margin-top:clamp(28px,3.2vw,48px);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding-inline:var(--m)}
.ttabs button,.fg summary .sel{position:relative}
.ttabs::-webkit-scrollbar{display:none}
.ttabs button{font:400 clamp(19px,1.55vw,23px)/1 var(--serif);padding:12px 0 15px;white-space:nowrap;color:var(--ink3);border-bottom:1px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:flex-start;gap:5px;transition:color .2s}
.ttabs button:hover{color:var(--ink)}
.ttabs button sup{font:500 10.5px/1 var(--sans);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.ttabs button[aria-pressed=true]{color:var(--ink);border-color:var(--ink)}

/* ---------- Barra de herramientas fija ---------- */
.tbar{position:sticky;top:var(--hh);transition:top .5s var(--ease);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.tbar-in{display:flex;align-items:center;gap:20px;min-height:56px;padding-inline:var(--m)}
.tb-btn{display:inline-flex;align-items:center;gap:10px;font:500 12px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.tb-btn svg{flex:none}
.tb-btn,.toggle,.more{transition:opacity .25s,color .25s}.tb-btn:hover,.more:hover{opacity:.62}.toggle:hover{color:var(--ink)}
.tb-n{font-size:14px;color:var(--ink2);white-space:nowrap}
.tb-n b{font-weight:500;color:var(--ink)}
.tb-sp{flex:1}
.tb-box{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink2);white-space:nowrap}
.tb-box .bar{width:96px;height:2px;background:var(--line);position:relative}
.tb-box .bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .5s var(--ease)}
.tb-box .ok{color:var(--wine)}
.sort{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:14px}
.sort label{color:var(--ink3)}
.sort select{appearance:none;-webkit-appearance:none;background:transparent;border:0;font:500 14px/1 var(--sans);color:var(--ink);padding:8px 20px 8px 0;cursor:pointer}
.sort::after{content:"";position:absolute;right:2px;top:50%;width:6px;height:6px;border-right:1.4px solid currentColor;border-bottom:1.4px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.m-only{display:none}

/* ---------- Cuerpo: filtros + resultados ---------- */
.tbody{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(24px,3vw,48px);padding-top:clamp(18px,2vw,28px);padding-bottom:var(--sec);transition:grid-template-columns .45s var(--ease)}
.tbody.nof{grid-template-columns:0 minmax(0,1fr);gap:0}
.tbody.nof .facets{opacity:0;pointer-events:none}
.facets{position:sticky;top:calc(var(--hh) + 57px + 18px);align-self:start;max-height:calc(100vh - 72px - 57px - 36px);overflow:auto;scrollbar-width:thin;padding-right:6px;transition:opacity .3s,top .5s var(--ease)}
.fs-h,.fs-f{display:none}
.fg{border-top:1px solid var(--line)}
.fg:first-of-type{border-top:0}
.fg summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;cursor:pointer;font:500 11.5px/1.3 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.fg summary::-webkit-details-marker{display:none}
.fg summary .sel{margin-left:auto;font-weight:500;color:var(--wine);letter-spacing:.04em}
.fg summary i{position:relative;width:10px;height:10px;flex:none}
.fg summary i::before,.fg summary i::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.2px;background:currentColor}
.fg summary i::after{transform:rotate(90deg);transition:transform .3s var(--ease)}
.fg[open] summary i::after{transform:rotate(0)}
.fg .opts{padding-bottom:16px}
.fo{display:grid;grid-template-columns:13px minmax(0,1fr) auto;align-items:baseline;gap:10px;width:100%;padding:5px 0;font-size:14.5px;line-height:1.35;color:var(--ink2);transition:color .2s}
.fo .mk{width:11px;height:11px;border:1px solid var(--ink3);align-self:center;transition:background .2s,border-color .2s}
.fo:hover{color:var(--ink)}
.fo[aria-pressed=true]{color:var(--ink)}
.fo[aria-pressed=true] .mk{background:var(--ink);border-color:var(--ink)}
.fo .n{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.fo:disabled{opacity:.32;cursor:default}
.fo.ser{font:400 17.5px/1.3 var(--serif)}
.fo.ser .n{font-family:var(--sans)}
.more{font:500 11px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:4px;margin-top:10px;color:var(--ink2)}
/* Escala de estilo */
.scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.scale button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 2px 10px;background:var(--bg2);font-size:11.5px;line-height:1.2;text-align:center;color:var(--ink2);transition:background .2s,color .2s}
.scale button .bars{display:flex;align-items:flex-end;gap:2px;height:16px}
.scale button .bars i{width:3px;background:var(--ink3);opacity:.35}
.scale button .bars i.f{opacity:1}
.scale button:hover{background:var(--bg3)}
.scale button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.scale button[aria-pressed=true] .bars i{background:var(--bg)}
.scale button:disabled{opacity:.35;cursor:default}
.scale-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);margin-top:8px}
.toggle{display:flex;justify-content:space-between;align-items:center;width:100%;padding:7px 0;font-size:14.5px;color:var(--ink2)}
.toggle .sw{width:30px;height:17px;border-radius:9px;background:var(--bg3);position:relative;transition:background .25s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.toggle[aria-pressed=true]{color:var(--ink)}
.toggle[aria-pressed=true] .sw{background:var(--ink)}
.toggle[aria-pressed=true] .sw::after{transform:translateX(13px)}

/* Filtros activos */
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:18px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--line);font-size:13px;background:var(--bg);transition:border-color .2s}
.chip:hover{border-color:var(--ink)}
.chip svg{width:11px;height:11px}
.chips .ul{font-size:11px;margin-left:6px}

/* ---------- Rejilla ---------- */
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(22px,2.4vw,36px) var(--g)}
.tbody.nof .tgrid{grid-template-columns:repeat(5,minmax(0,1fr))}
.tgrid .pc .nm{font-size:19px}
.tgrid .pc .info{gap:3px 12px}
.meter{grid-column:1/-1;display:flex;align-items:center;gap:3px;margin-top:5px;font-size:12px;color:var(--ink3)}
.meter i{width:12px;height:2px;background:var(--line)}
.meter i.f{background:var(--ink2)}
.meter em{font-style:normal;margin-left:7px}
.pc.out .fld img{opacity:.5}
.pc .badge.out{color:var(--ink)}
.qa.ntf{background:var(--bg);color:var(--ink);border-top:1px solid var(--line)}
.qa.ntf svg{flex:none}
.pc .bx.nc{color:var(--ink3)}
.tgrid .pc{animation:pin .5s var(--ease) both}
@keyframes pin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* Piezas editoriales dentro de la rejilla */
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;isolation:isolate;color:#fff;background:var(--dark);text-align:left;min-height:100%;animation:pin .5s var(--ease) both}
.tile>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.2s var(--ease)}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,18,16,.28),rgba(20,18,16,0) 30%,rgba(20,18,16,0) 45%,rgba(20,18,16,.62))}
.tile:hover>img{transform:scale(1.04)}
.tile .tp,.tile .bt{padding:clamp(14px,1.4vw,20px)}
.tile b{display:block;font:400 clamp(24px,2vw,30px)/1.08 var(--serif);letter-spacing:-.01em}
.tile p{font-size:14px;line-height:1.45;opacity:.9;margin:10px 0 16px;max-width:26ch}
.tile .ul{font-size:11px}
.tile.tq{background:var(--dark)}
.tile.tq::before{display:none}
.tile.tq .tq-ph{position:relative;flex:1 1 auto;min-height:120px;overflow:hidden}
.tile.tq .tq-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.tile.tq:hover .tq-ph img{transform:scale(1.04)}
.tile.tq .bt{flex:none}
.tile.tq .cap{display:block;color:rgba(238,233,225,.7);margin-bottom:10px}
.tile.seasons{background:var(--bg2);color:var(--ink)}
.tile.seasons::before{display:none}
.tile.seasons .rows{display:grid;grid-template-rows:repeat(4,1fr);flex:1}
.tile.seasons .rows span{display:flex;justify-content:space-between;align-items:center;padding:0 clamp(14px,1.4vw,20px);font:400 19px/1 var(--serif)}
.tile.seasons .rows span small{font:400 12.5px/1 var(--sans);color:rgba(43,44,45,.7)}
/* Sin resultados */
.tempty{padding:clamp(40px,6vw,96px) 0;max-width:620px}
.tempty h2{font:400 clamp(30px,3vw,44px)/1.05 var(--serif)}
.tempty p{color:var(--ink2);margin-top:14px}
.tempty .sug{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.tempty .alts{margin-top:22px;font-size:14.5px;color:var(--ink2)}
.tempty .alts a{color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:1px;margin-right:4px}
.tempty .alts a:hover{border-color:var(--ink)}

/* ---------- Encuentra tu vino ---------- */
.quiz{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:clamp(0px,3vw,40px);background:rgba(20,18,16,.55);opacity:0;pointer-events:none;transition:opacity .35s}
.quiz.on{opacity:1;pointer-events:auto}
.qz{position:relative;width:min(1180px,100%);height:min(760px,100%);background:var(--bg);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);overflow:hidden;transform:translateY(16px);transition:transform .5s var(--ease)}
.quiz.on .qz{transform:none}
.qz-ph{position:relative;overflow:hidden;background:var(--dark)}
.qz-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .8s var(--ease),transform 6s linear}
.qz-ph{transition:background-color .6s}
.qz-ph.contain{background:var(--bg2)}
.qz-ph.contain img{object-fit:contain;mix-blend-mode:multiply;padding:8%}
.qz-ph.contain .cap{color:var(--ink2);text-shadow:none}
.qz-ph .cap{position:absolute;left:18px;bottom:16px;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.35)}
.qz-r{display:flex;flex-direction:column;padding:clamp(22px,3vw,44px);overflow:auto}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.qz-steps{display:flex;gap:6px}
.qz-steps i{width:28px;height:2px;background:var(--line)}
.qz-steps i.on{background:var(--ink)}
.qz-x{display:inline-flex;align-items:center;gap:8px;font:500 12px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.qz-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:clamp(18px,3vw,40px) 0}
.qz-q{font:400 clamp(34px,3.6vw,56px)/1.02 var(--serif);letter-spacing:-.015em}
.qz-q:focus{outline:none}
.qz-sub{color:var(--ink2);margin-top:12px}
.qz-opts{list-style:none;margin-top:clamp(20px,2.6vw,36px);border-top:1px solid var(--line)}
.qz-opts button{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;padding:14px 0;border-bottom:1px solid var(--line);font:400 clamp(21px,1.9vw,28px)/1.15 var(--serif);transition:padding .3s var(--ease),color .2s}
.qz-opts button span{font:400 13px/1.3 var(--sans);color:var(--ink3);text-align:right}
.qz-opts button:hover{padding-left:10px}
.qz-opts button svg{opacity:0;transition:opacity .2s}
.qz-opts button:hover svg{opacity:1}
.qz-scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--g);margin-top:clamp(20px,2.6vw,36px)}
.qz-scale button{display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:150px;padding:16px;background:var(--bg2);text-align:left;transition:background .2s}
.qz-scale button:hover{background:var(--bg3)}
.qz-scale button b{font:400 21px/1.1 var(--serif)}
.qz-scale button small{display:block;font-size:12.5px;color:var(--ink2);margin-top:6px}
.qz-scale .bars{display:flex;align-items:flex-end;gap:3px;height:26px}
.qz-scale .bars i{width:5px;background:var(--ink)}
.qz-scale .bars i:not(.f){opacity:.18}
.qz-skip{align-self:flex-start;margin-top:22px}
.qz-back{font:500 12px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.qz-res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--g);margin-top:24px}

(function readURL(){
  const u=new URLSearchParams(location.search);
  const t=u.get('tipo');if(t){const m={tintos:'tinto',blancos:'blanco',rosados:'rosado',ensamble:'tinto',estuches:'estuche'};S.tipo=TIPOS.some(x=>x[0]===t)?t:(m[t]||'todo')}
  FACETS.forEach(f=>{const v=u.get(URLK[f.k]);if(v)v.split(',').forEach(x=>{if(f.keys.includes(x))S.sets[f.k].add(x)})});
  (u.get('f')||'').split(',').forEach(x=>{
    if(x==='botellines'){S.sets.tam.add('s375');S.sets.tam.add('s187')}
    else if(x==='gourmet')S.tipo='gourmet';
    else if(x==='estuches')S.tipo='estuche';
    else if(x==='organicos')S.sets.linea.add('uvas-organicas');
    else if(x==='postre')S.tipo='postre';
  });
  const mo=u.get('momento');if(mo){const al={celebrar:'brindis'};if(al[mo])S.sets.mom.add(al[mo]);else if(mo==='mesa')S.sets.mar.add('mex');else if(MAR[mo])S.sets.mar.add(mo)}
  const pr=+u.get('precio');if(pr>0)S.max=pr;
  S.q=u.get('q')||'';
  if(SORTS[u.get('orden')])S.sort=u.get('orden');
  if(S.sets.linea.size===1&&u.get('linea'))S.banner=[...S.sets.linea][0];
})();
function writeURL(){
  const u=new URLSearchParams();
  if(S.tipo!=='todo')u.set('tipo',S.tipo);
  FACETS.forEach(f=>{if(S.sets[f.k].size)u.set(URLK[f.k],[...S.sets[f.k]].join(','))});
  if(S.max)u.set('precio',S.max);
  if(S.q)u.set('q',S.q);
  if(S.sort!=='rec')u.set('orden',S.sort);
  const qs=u.toString();
  try{history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash)}catch(e){}
}

/* ---------- Filtrado ---------- */
function match(id,skip){
  const p=P[id];
  if(skip!=='tipo'&&S.tipo!=='todo'&&tipoOf(id)!==S.tipo)return false;
  if(S.max&&p.price>S.max)return false;
  if(S.q&&!qHits().set.has(id))return false;
  for(const f of FACETS){
    if(f.k===skip)continue;
    const sel=S.sets[f.k];if(!sel.size)continue;
    const a=ATT[f.k](id);
    if(f.k==='flag'){for(const x of sel)if(!a.includes(x))return false}
    else if(![...sel].some(x=>a.includes(x)))return false;
  }
  return true;
}
/* Búsqueda: la misma función que el buscador del encabezado (searchIds en cetto-base.js) */
let _qc={q:null};
function qHits(){if(_qc.q!==S.q){const ids=S.q?searchIds(S.q):[];_qc={q:S.q,set:new Set(ids),rank:Object.fromEntries(ids.map((id,i)=>[id,i]))}}return _qc}
const results=()=>IDS.filter(id=>match(id));
function sorted(list){
  const by={
    rec:(a,b)=>S.q?(qHits().rank[a]-qHits().rank[b]):RANK[a]-RANK[b],
    prem:(a,b)=>(P[b].medals||0)-(P[a].medals||0)||RANK[a]-RANK[b],
    asc:(a,b)=>P[a].price-P[b].price,
    desc:(a,b)=>P[b].price-P[a].price,
    est:(a,b)=>((TX[a]&&TX[a][0])||9)-((TX[b]&&TX[b][0])||9)||RANK[a]-RANK[b]
  }[S.sort];
  return list.slice().sort((a,b)=>(P[a].out?1:0)-(P[b].out?1:0)||by(a,b));
}
const countFor=(fk,key)=>IDS.filter(id=>match(id,fk)&&(fk==='flag'?ATT.flag(id).includes(key)&&[...S.sets.flag].every(x=>ATT.flag(id).includes(x)):ATT[fk](id).includes(key))).length;

  let h='';
  if(qStep===0){
    qDefault();[...Object.values(QSC.mom),...Object.values(QSC.mar),...Object.values(QSC.est)].forEach(m=>{const i=new Image();i.src=m[0];const j=new Image();j.src='media/bot/'+m[2]+'.png'});
    h='<h2 class="qz-q">¿Para qué momento?</h2><p class="qz-sub">Empecemos por la ocasión. Lo demás lo afinamos después.</p><ul class="qz-opts">'+Object.entries(MOM).map(([k,l])=>'<li><button data-qa="mom" data-v="'+k+'">'+l+arr+'</button></li>').join('')+'</ul>';
  }else if(qStep===1){
    qDefault();
    h=back+'<h2 class="qz-q" style="margin-top:14px">¿Qué habrá en la mesa?</h2><p class="qz-sub">Si todavía no lo sabes, elige “Solo la copa”.</p><ul class="qz-opts">'+Object.entries(qMarOpts).map(([k,l])=>'<li><button data-qa="mar" data-v="'+k+'">'+l+arr+'</button></li>').join('')+'</ul>';
  }else if(qStep===2){
    const ex={1:'Como Chenin Blanc u Otoño',2:'Como Merlot o Blanc de Zinfandel',3:'Como Petite Sirah o Chardonnay Reserva Privada',4:'Como Nebbiolo o Terra'};
    qDefault();
    /* una gota que crece y se oscurece: del más ligero al más intenso */
    const DROP={1:['#EDE2B8',20],2:['#DDA99C',26],3:['#A23E48',32],4:['#5A1A28',38]};
    h=back+'<h2 class="qz-q" style="margin-top:14px">¿Cómo te gusta el vino?</h2><p class="qz-sub">Del más ligero al más intenso.</p><div class="qz-scale">'+[1,2,3,4].map(k=>'<button data-qa="est" data-v="'+k+'"><span class="qz-drop" style="--c:'+DROP[k][0]+';--s:'+DROP[k][1]+'px" aria-hidden="true"></span><span><b>'+EST[k]+'</b><small>'+ex[k]+'</small></span></button>').join('')+'</div><button class="ul qz-skip" data-qa="est" data-v="0">No sé, sorpréndeme</button>';
  }else{
    const r=quizResult();
    {const c=QA.mar&&QSC.mar[QA.mar]?QSC.mar[QA.mar]:QSC.mom[QA.mom];qzScene(c[0],c[1],r.top[0],'Tu vino: '+qName(r.top[0]))}
    h='<span class="cap" style="color:var(--ink3)">Tu selección</span><h2 class="qz-q" style="margin-top:12px">'+r.title+'</h2><div class="qz-res">'+r.top.map(id=>{const c=tcard(id,0);const k=c.lastIndexOf('</span></a>');return c.slice(0,k)+'<span class="why">'+r.why(id)+'</span>'+c.slice(k)}).join('')+'</div>'+
      '<div class="qz-acts"><button class="btn btn-ink" id="qzAll">Agregar los 3 · '+money(r.top.reduce((a,id)=>a+P[id].price,0))+'</button><button class="ul" id="qzApply">'+(r.n===1?'Ver el único que coincide':'Ver los '+r.n+' vinos que coinciden')+'</button><button class="qz-back" data-qrestart>Empezar de nuevo</button></div>';
    setTimeout(()=>{$('qzAll').onclick=()=>{r.top.forEach(id=>add(id,1,true));toast(r.top[0],1);closeQuiz()};$('qzApply').onclick=()=>{applyQuiz(r);closeQuiz()}},0);
  }
  $('qzBody').innerHTML=h;
  /* cada pregunta nueva recibe el foco y se anuncia el paso */
  const hq=$('qzBody').querySelector('.qz-q');
  $('qzLive').textContent=qStep<3?'Pregunta '+(qStep+1)+' de 3':'Tu selección, tres vinos';
  if(hq&&$('quiz').classList.contains('on')){hq.tabIndex=-1;setTimeout(()=>hq.focus({preventScroll:true}),30)}
}
$('qzBody').addEventListener('click',e=>{
  const b=e.target.closest('[data-qa]');if(b){QA[b.dataset.qa]=b.dataset.v;qStep++;renderQuiz();return}
  if(e.target.closest('[data-qback]')){qStep--;renderQuiz();return}
  if(e.target.closest('[data-qrestart]')){qStep=0;renderQuiz()}
});
function quizResult(){
  const m=QA.mom,x=QA.mar,es=+QA.est;
  const pool=IDS.filter(id=>{const p=P[id];return !p.out&&p.c!=='gourmet'&&!(p.nb&&p.c!=='destilado')&&(m==='regalo'||p.c!=='estuche')&&(m==='regalo'||p.c!=='destilado')});
  const score=id=>{const t=TX[id]||[0,''];let s=0;if(t[1].split(' ').includes(m))s+=5;if(x&&x!=='nada'&&marOf(id).includes(x))s+=3;if(es&&t[0])s+=2.4-Math.abs(t[0]-es)*1.3;s+=Math.log((P[id].medals||0)+1)*.25;return s};
  const top=pool.sort((a,b)=>score(b)-score(a)||RANK[a]-RANK[b]).slice(0,3);
  // filtros equivalentes: se relajan si dejan la búsqueda vacía
  const tries=[[m,x,es],[m,x,0],[m,0,0]];let f,n=0;
  for(const [a,b,c] of tries){const bak=snapshot();FACETS.forEach(z=>S.sets[z.k].clear());S.tipo='todo';S.max=0;S.q='';S.sets.mom.add(a);if(b&&b!=='nada')S.sets.mar.add(b);if(c)S.sets.est.add(String(c));n=results().length;restore(bak);if(n){f=[a,b,c];break}}
  const FOOD={carne:'carnes rojas',aves:'aves y cerdo',mar:'pescados y mariscos',pasta:'pastas y pizza',queso:'quesos y botanas',mex:'cocina mexicana',postre:'postres'};
  const trim=t=>{t=(t||'').trim().replace(/[.…\s]+$/,'');return t.length>96?t.slice(0,94).replace(/\s\S*$/,'').replace(/[,;:]$/,'')+'…':t+'.'};
  const clean=t=>t.replace(/^(Ideal para acompañar|Acompaña muy bien con|Acompaña muy bien|Acompaña bien|Acompaña|Se recomienda con|Marida con|Perfecto para) /i,'').replace(/^./,c=>c.toLowerCase());
  const why=id=>{const p=P[id];
    if(x&&x!=='nada'){const fl=FOOD[x];
      if(marOf(id).includes(x)){const parts=(p.mar||'').split(/\.\s*/).filter(Boolean);const hit=parts.find(z=>MARX[x].test(z));
        if(hit)return 'Para '+fl+': '+trim(clean(hit));
        const e=TX[id]&&TX[id][0];
        if(x==='mex')return (e?'Estilo '+EST[e].toLowerCase()+', de':'De')+' nuestra selección para la mesa mexicana.';
        return parts[0]?'Para '+fl+': '+trim(clean(parts[0])):'Va bien con '+fl+'.'}
      const e=TX[id]&&TX[id][0];return 'Para '+fl+', por su estilo '+(e?EST[e].toLowerCase():'versátil')+'.'}
    return p.q?trim(p.q):''};
  return {top,n,f,why,title:'Tres vinos para '+MOM[m].charAt(0).toLowerCase()+MOM[m].slice(1).replace(/^para /,'')+(x&&x!=='nada'&&!(m==='asada'&&x==='carne')?' con '+FOOD[x]:'')+'.'};
}
function applyQuiz(r){
  const [a,b,c]=r.f||[QA.mom,0,0];
  FACETS.forEach(z=>S.sets[z.k].clear());S.tipo='todo';S.max=0;S.q='';S.banner='';
  S.sets.mom.add(a);if(b&&b!=='nada')S.sets.mar.add(b);if(c)S.sets.est.add(String(c));
  renderIntro();renderAll(true);
}

/* ---------- Inicio ---------- */
renderChrome({solid:true,page:'tienda'});
const _rc=renderCart;renderCart=function(){_rc();renderBox()};
renderIntro();renderAll(false);renderBox();syncFacets();
$('trustShip').textContent='Gratis desde '+money(FREE)+'. Pide hoy y '+eta('envio').txt.replace(/^Llega/,'llega')+'.';
if(location.hash==='#encuentra')openQuiz();
addEventListener('hashchange',()=>{if(location.hash==='#encuentra')openQuiz()});
document.addEventListener('click',e=>{const a=e.target.closest('a[href$="#encuentra"]');if(a&&a.pathname===location.pathname){e.preventDefault();openQuiz()}});
</script>
